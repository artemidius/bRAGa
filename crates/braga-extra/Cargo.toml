[package]
name = "braga-extra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
description = "AGPL-3.0-or-later extra tier for bRAGa: per-record AEAD and decrypt-then-score retrieval"
publish = false

[dependencies]
braga = { path = "../braga" }
braga-chunker = { path = "../braga-chunker" }
braga-embedder = { path = "../braga-embedder" }
braga-storage = { path = "../braga-storage" }
chacha20poly1305 = "0.10"
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
rusqlite = { version = "0.43", default-features = false, features = ["bundled-sqlcipher"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
