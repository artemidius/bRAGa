[package]
name = "braga-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
publish = false

[lib]
name = "braga_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
braga = { path = "../braga" }
braga-chunker = { path = "../braga-chunker" }
braga-embedder = { path = "../braga-embedder" }
braga-storage = { path = "../braga-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
