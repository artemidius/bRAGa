# SPDX-License-Identifier: Apache-2.0

[workspace]
members = ["crates/braga", "crates/braga-chunker", "crates/braga-storage"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/artemidius/bRAGa"
authors = ["Artem Sborets and contributors"]
description = "Local-first, encrypted retrieval toolkit for RAG pipelines"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `Config`/`ConfigError` live in `config` per the agreed public API.
module_name_repetitions = "allow"
